[modules]
autoload=yes

; Load core telephony and PBX modules
preload => res_pjproject.so
preload => res_pjsip.so

; Fax modules
load => res_fax.so
load => res_fax_spandsp.so

; Codecs for T.30 / T.38 audio
load => codec_ulaw.so
load => codec_alaw.so
load => codec_gsm.so
load => format_pcm.so
load => format_g729.so
load => format_wav.so

; Channel drivers
load => chan_pjsip.so
load => chan_bridge_pjsip.so

; Bridging and core apps
load => app_playback.so
load => app_echo.so
load => app_sendtext.so

; Don't load unused legacy drivers
noload => chan_sip.so
noload => chan_skinny.so
noload => chan_unistim.so
noload => chan_mgcp.so
noload => res_hep.so
