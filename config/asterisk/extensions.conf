; ==============================================================================
; Dialplan Configuration - Outbound Fax Engine (SpanDSP)
; ==============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
GLOBAL_FAX_HEADER=Virtual Fax Gateway
GLOBAL_CALLER_ID=+18005550199

[send-fax]
; Triggered when an outbound call file or AMI Originate is answered
exten => s,1,NoOp(=====================================================)
same => n,NoOp(>>> STARTING OUTBOUND FAX TRANSMISSION <<<)
same => n,NoOp(Recipient: ${RECIPIENT} | Spool File: ${FAX_FILE})
same => n,NoOp(=====================================================)

; Configure T.30 / SpanDSP Fax Parameters
same => n,Set(FAXOPT(headerinfo)=${IF($["${FAX_HEADER}" != ""]?${FAX_HEADER}:${GLOBAL_FAX_HEADER})})
same => n,Set(FAXOPT(localstationid)=${IF($["${FAX_CALLERID}" != ""]?${FAX_CALLERID}:${GLOBAL_CALLER_ID})})
same => n,Set(FAXOPT(maxrate)=14400)
same => n,Set(FAXOPT(minrate)=2400)
same => n,Set(FAXOPT(ecm)=yes)

; Pause briefly for far-end CED/DIS tones
same => n,Wait(1.5)

; Transmit Fax Image
same => n,SendFAX(${FAX_FILE},d)

; Telemetry & Post-Transmission Log
same => n,NoOp(>>> TRANSMISSION COMPLETE <<<)
same => n,NoOp(Status: ${FAXSTATUS} | Pages: ${FAXPAGES} | Error: ${FAXERROR})
same => n,NoOp(Bitrate: ${FAXOPT(rate)} | Resolution: ${FAXOPT(resolution)})
same => n,Hangup()

; Handle Call Setup Failures
exten => failed,1,NoOp(>>> FAX CALL FAILED <<<)
same => n,NoOp(Destination: ${RECIPIENT} | Failure Reason: ${REASON})
same => n,Hangup()

[from-external]
; Reject unsolicited inbound calls (Gateway is outbound-only)
exten => _.,1,NoOp(Incoming call rejected on outbound-only gateway.)
same => n,Hangup()
