; ==============================================================================
; PJSIP Configuration - Zero-Cost 8YY Toll-Free Open SIP Trunks
; ==============================================================================

[global]
type=global
user_agent=ZeroCost-VirtualFaxGateway/1.0

; --- Transports ---
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; ==============================================================================
; TRUNK 1: Alcazar Networks Open 8YY Toll-Free Gateway (Primary)
; Reverse-billed US Toll-Free Termination (No Auth / $0.00 Cost)
; ==============================================================================
[alcazar_tf]
type=endpoint
transport=transport-udp
context=from-external
disallow=all
allow=ulaw
allow=alaw
direct_media=no
t38_udptl=yes
t38_udptl_ec=redundancy
t38_udptl_maxdatagram=400
fax_detect=no
from_domain=tf.alcazarnetworks.com
aors=alcazar_tf_aor

[alcazar_tf_aor]
type=aor
contact=sip:tf.alcazarnetworks.com:5060

[alcazar_tf_identify]
type=identify
endpoint=alcazar_tf
match=tf.alcazarnetworks.com

; ==============================================================================
; TRUNK 2: Sip-Trunk.Info Open 8YY Toll-Free Gateway (Fallback)
; ==============================================================================
[fallback_tf]
type=endpoint
transport=transport-udp
context=from-external
disallow=all
allow=ulaw
allow=alaw
direct_media=no
t38_udptl=yes
t38_udptl_ec=redundancy
t38_udptl_maxdatagram=400
fax_detect=no
from_domain=tollfree.sip-trunk.info
aors=fallback_tf_aor

[fallback_tf_aor]
type=aor
contact=sip:tollfree.sip-trunk.info:5060

[fallback_tf_identify]
type=identify
endpoint=fallback_tf
match=tollfree.sip-trunk.info

; ==============================================================================
; TRUNK 3: BulkVS Open 8YY Toll-Free Termination (Secondary Open Trunk)
; Reverse-billed US Toll-Free Termination (No Auth / $0.00 Cost)
; ==============================================================================
[bulkvs_tf]
type=endpoint
transport=transport-udp
context=from-external
disallow=all
allow=ulaw
allow=alaw
direct_media=no
t38_udptl=yes
t38_udptl_ec=redundancy
t38_udptl_maxdatagram=400
fax_detect=no
from_domain=bvs8yy.bulkvs.com
aors=bulkvs_tf_aor

[bulkvs_tf_aor]
type=aor
contact=sip:bvs8yy.bulkvs.com:5060

[bulkvs_tf_identify]
type=identify
endpoint=bulkvs_tf
match=bvs8yy.bulkvs.com

